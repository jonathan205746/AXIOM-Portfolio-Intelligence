# Single-host demo (local or one EC2 instance).
# Default: Streamlit only (fits t3.medium / 4 GB).
# Optional API: docker compose --profile api up --build -d  (use t3.large)

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      PORT: "8501"
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DB_DIR: /data
      FAISS_INDEX_PATH: /data/faiss_index
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: portfolio-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DB_DIR: /data
      FAISS_INDEX_PATH: /data/faiss_index
      DATABASE_URL: sqlite:////data/portfolio_optimizer.db
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  app-data:
