# docker-compose.aws.yml
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: portfolio-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////tmp/data/portfolio_optimizer.db
      - DB_DIR=/tmp/data
      - FAISS_INDEX_PATH=/tmp/faiss_index
      - NEWS_API_KEY_1=${NEWS_API_KEY_1}
      - NEWS_API_KEY_2=${NEWS_API_KEY_2}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - app-data:/tmp/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-dashboard
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):8080
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app-data: