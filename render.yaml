# Render Blueprint for AI-Powered Portfolio Optimizer
# Using Docker runtime so your Dockerfiles are respected

services:
  # ═══════════════════════════════════════════════════════════
  # SERVICE 1: FastAPI Backend
  # ═══════════════════════════════════════════════════════════
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile 
    envVars:
      - key: PORT
        value: 10000
      - key: NEWS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////tmp/portfolio_optimizer.db
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true

  # ═══════════════════════════════════════════════════════════
  # SERVICE 2: Streamlit Dashboard
  # ═══════════════════════════════════════════════════════════
  - type: web
    name: portfolio-dashboard
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        fromService:
          name: portfolio-api
          type: web
          property: host
      - key: NEWS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /_stcore/health
    autoDeploy: true