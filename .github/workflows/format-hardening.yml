name: Temporary hardening formatter

on:
  push:
    branches:
      - chore/axiom-release-security-hardening

permissions:
  contents: write

jobs:
  format:
    name: Apply Black formatting
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/axiom-release-security-hardening

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install pinned formatter
        run: python -m pip install black==24.2.0

      - name: Apply formatter
        run: black frontend src backend tests

      - name: Commit formatting changes
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend src backend tests
          git diff --cached --check
          git commit -m "style: apply Black formatting"
          git push origin HEAD:chore/axiom-release-security-hardening
