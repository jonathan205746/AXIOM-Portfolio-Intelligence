name: Deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-frontend.txt
            requirements-dev.txt
            requirements-backend.txt

      - name: Install development environment
        run: make install-dev

      - name: Run repository quality contract
        run: make check

      - name: Check patch whitespace
        run: git diff --check

  deploy:
    name: Deploy to EC2 (HTTPS Production)
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -Eeuo pipefail

          response="$(
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          token="$(jq -r '.value' <<< "$response")"

          OIDC_TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for name in ("aud", "sub", "repository", "ref", "environment"):
              print(f"{name}={claims.get(name)}")
          PY

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubPortfolioProduction
          mask-aws-account-id: true

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Check whether frontend image exists
        id: frontend_image
        shell: bash
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frontend image already exists; build and push will be skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend image does not exist; build and push will run"
          fi

      - name: Configure Docker Buildx
        if: steps.frontend_image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push frontend immutable image
        if: steps.frontend_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check whether API image exists
        id: api_image
        shell: bash
        env:
          ECR_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-api
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "API image already exists; build and push will be skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "API image does not exist; build and push will run"
          fi

      - name: Build and push API immutable image
        if: steps.api_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }}-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy through Systems Manager (HTTPS Production)
        shell: bash
        env:
          FRONTEND_IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          API_IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }}-api
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          APP_DIRECTORY: ${{ vars.APP_DIRECTORY }}
          FRONTEND_CONTAINER_NAME: ${{ vars.FRONTEND_CONTAINER_NAME }}
          API_CONTAINER_NAME: ${{ vars.API_CONTAINER_NAME }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          set -Eeuo pipefail

          deploy_script="$(base64 -w 0 scripts/deploy_prod.sh)"

          parameters="$(
            jq -n \
              --arg script "$deploy_script" \
              --arg frontend_image "$FRONTEND_IMAGE_URI" \
              --arg api_image "$API_IMAGE_URI" \
              --arg registry "$ECR_REGISTRY" \
              --arg region "$AWS_REGION" \
              --arg directory "$APP_DIRECTORY" \
              --arg frontend_container "$FRONTEND_CONTAINER_NAME" \
              --arg api_container "$API_CONTAINER_NAME" \
              --arg health "$HEALTHCHECK_URL" \
              '{
                commands: [
                  "echo " + ($script | @sh) + " | base64 -d > /tmp/axiom-deploy.sh",
                  "chmod 700 /tmp/axiom-deploy.sh",
                  "/tmp/axiom-deploy.sh "
                    + ($frontend_image | @sh) + " "
                    + ($api_image | @sh) + " "
                    + ($registry | @sh) + " "
                    + ($region | @sh) + " "
                    + ($directory | @sh) + " "
                    + ($frontend_container | @sh) + " "
                    + ($api_container | @sh) + " "
                    + ($health | @sh)
                ]
              }'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy GitHub commit $GITHUB_SHA (HTTPS Production)" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command submitted: $command_id"

          status="Pending"

          for attempt in $(seq 1 90); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || echo Pending
            )"

            echo "Deployment status: $status"

            case "$status" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || true

          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent \
              --output text || true

            echo "Production deployment failed with status: $status"
            exit 1
          fi

          echo "Production deployment completed successfully"