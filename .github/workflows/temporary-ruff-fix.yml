name: Temporary Ruff safe fixer

on:
  push:
    branches:
      - chore/axiom-release-security-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/axiom-release-security-hardening

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.8

      - name: Apply safe Ruff fixes
        run: ruff check frontend src backend tests --fix

      - name: Commit safe fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No safe Ruff fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend src backend tests
          git commit -m "style: apply safe Ruff fixes"
          git push origin HEAD:chore/axiom-release-security-hardening
